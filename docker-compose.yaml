# nginx proxy address - http://172.17.0.1:8094

name: limesurvey
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  limesurvey:
    image: martialblog/limesurvey:latest
    pull_policy: always
    container_name: limesurvey-app
    restart: always
    logging: *default-logging
    networks:
      - limesurvey
      - proxy
      - cloudflare
    ports:
      - "172.17.0.1:8094:8080"
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: limesurvey-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      DB_TYPE: mysql
      DB_HOST: limesurvey-db
      DB_PORT: 3306
      DB_NAME: ${DB_CREATE_DATABASE_NAME:-limesurvey}
      DB_USERNAME: ${DB_USER_NAME:-limesurvey}
      DB_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      ADMIN_USER: ${APP_ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${APP_ADMIN_PASS:-changeme_admin_password}
      ADMIN_NAME: ${APP_ORG_NAME:-LimeSurvey} Admin
      ADMIN_EMAIL: ${APP_ADMIN_USER:-admin}@${BASE_DOMAIN_NAME:-example.com}
      PUBLIC_URL: https://${BASE_HOST_NAME:-$HOSTNAME}
      LISTEN_PORT: 8080
    volumes:
      - ./volumes/data/limesurvey:/var/www/html/upload
      - ./volumes/config/limesurvey:/var/www/html/application/config
    depends_on:
      limesurvey-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - 'traefik.enable=true'
      - 'cloudflare.enable=true'
      - 'traefik.docker.network=proxy'
      - 'cloudflare.service=http://limesurvey-app:8080'
      - 'cloudflare.hostname=limesurvey.${CLOUDFLARE_ZONE_NAME:-}'
      - 'traefik.http.routers.limesurvey-app.entrypoints=http'
      - 'traefik.http.routers.limesurvey-app-secure.tls=true'
      - 'traefik.http.routers.limesurvey-app.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.middlewares.limesurvey-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.limesurvey-app.middlewares=limesurvey-app-https-redirect'
      - 'traefik.http.routers.limesurvey-app-secure.entrypoints=https'
      - 'traefik.http.routers.limesurvey-app-secure.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.routers.limesurvey-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.limesurvey-app-secure.service=limesurvey-app'
      - 'traefik.http.services.limesurvey-app.loadbalancer.server.port=8080'

  limesurvey-db:
    image: mariadb:latest
    pull_policy: always
    container_name: limesurvey-db
    restart: always
    logging: *default-logging
    networks:
      - limesurvey
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: limesurvey-db
      MARIADB_DATABASE: ${DB_CREATE_DATABASE_NAME:-limesurvey}
      MARIADB_USER: ${DB_USER_NAME:-limesurvey}
      MARIADB_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      MARIADB_ROOT_PASSWORD: ${DB_ADMIN_PASS:-changeme_admin_password}
    volumes:
      - ./volumes/data/db/mariadb/limesurvey:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  limesurvey:
    name: limesurvey
    external: false
  proxy:
    external: true
  cloudflare:
    external: true
