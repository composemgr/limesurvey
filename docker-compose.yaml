# nginx proxy address - http://172.17.0.1:8094

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  limesurvey:
    image: martialblog/limesurvey:latest
    container_name: limesurvey-app
    restart: unless-stopped
    logging: *default-logging
    networks:
      - limesurvey
    ports:
      - "8094:80"
    environment:
      TZ: ${TZ:-America/New_York}
    volumes:
      - ./rootfs/data/limesurvey:/data
      - ./rootfs/config/limesurvey:/config
    depends_on:
      - limesurvey-db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  limesurvey-db:
    image: mariadb:11
    container_name: limesurvey-db
    restart: unless-stopped
    logging: *default-logging
    networks:
      - limesurvey
    environment:
      TZ: ${TZ:-America/New_York}
      MARIADB_DATABASE: ${DB_CREATE_DATABASE_NAME:-limesurvey}
      MARIADB_USER: ${DB_USER_NAME:-limesurvey}
      MARIADB_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      MARIADB_ROOT_PASSWORD: ${DB_ADMIN_PASS:-changeme_root_password}
    volumes:
      - ./rootfs/db/mariadb/limesurvey:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  limesurvey:
    external: false
